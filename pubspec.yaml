name: waqt
description: "Waqt: the right dua for the moment you are in, every item with a verified source."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.1.3
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  adhan: ^2.0.0+1
  hijri: ^3.0.1
  geolocator: ^14.1.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  flutter_local_notifications: ">=22.3.3 <23.0.0"
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  home_widget: ^0.10.0
  sensors_plus: ^7.1.1
  sqflite: ^2.4.5
  path_provider: ^2.1.6
  archive: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.2
  yaml: ^3.1.4
  sqflite_common_ffi: ^2.4.5

flutter:

  uses-material-design: true
  generate: true
  shaders:
    - shaders/sky.frag
  assets:
    - assets/data/
    - assets/content/
    - assets/sources/
    - assets/ornob-aadi-signature/ornob-aadi-signature-bold-dark.png
  fonts:
    - family: SchibstedGrotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf

