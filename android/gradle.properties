# Sized for an 8 GB machine: a larger heap makes Windows swap or crash.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Reuse task outputs between builds; parallel off to keep memory low.
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.configuration-cache=false
