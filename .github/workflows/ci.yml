name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --line-length 120 --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --exclude-tags screenshots
      # The engine works in device-local time; exercise real DST changeovers.
      - run: TZ=Europe/London flutter test test/domain/moment_engine_test.dart
      - run: TZ=America/Toronto flutter test test/domain/moment_engine_test.dart
      - run: TZ=Pacific/Auckland flutter test test/domain/moment_engine_test.dart
      - run: flutter build apk --flavor dev --debug
